# Repo website gi? l?p ? th? plugin HIRAKU (C3) b?ng Pull Request th?t.
# B?n xem tr??c: t?m dung site demo ê¬ótés tren c?ng (https://hiraku.synthgora.com/demo-site), ten mi?n ?a xac minh.
# Repo th?t c?a khach s? build + deploy b?n xem tr??c c?a PR r?i ??a URL ?o vao preview-url.
name: HIRAKU accessibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  id-token: write          # OIDC: repo khong gi? khoa nao
  contents: read
  security-events: write   # t?i SARIF len tab Code scanning
jobs:
  hiraku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: hiraku
        uses: manhdauvn09-manhds/hiraku-check@v1
        with:
          project: AOBA-1029-195258
          preview-url: https://hiraku.synthgora.com/demo-site
          site-dir: public                 # trang .html ??i trong PR Å® ???ng d?n c?n ki?m; khong ??i gi thi ki?m "/"
          gate: ${{ github.event_name == 'push' && 'report-only' || 'standard' }}   # nhanh chinh ch? bao + ??t m?c, PR m?i ch?n
          ai: 'true'                        # AI gop y (khong ch?n merge)
          baseline: ${{ github.event_name == 'push' && 'true' || 'false' }}   # nhanh chinh Å® ??t m?c
      - if: always() && hashFiles('hiraku.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: hiraku.sarif, category: hiraku }
